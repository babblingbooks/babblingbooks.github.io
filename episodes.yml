# babbling books: every season and episode lives here.
#
# Both the home page and the Episodes page are built from this file, so
# adding a new episode is just adding a new "- type: episode" block below
# and re-rendering. Newest season goes first.
#
# Episode fields:
#   season / episode   numbers
#   title              shown on the card (usually the chapters)
#   chapters           [first, last] chapter covered, draws the progress bar
#                      (use "epilogue" as the last one for the final episode,
#                      e.g. [95, epilogue])
#   released           YYYY-MM-DD
#   length             minutes
#   spotify            episode link (leave blank until it's out)
#   youtube            episode link (leave blank until the video is up)
#   tag                optional little badge, e.g. Megasode or Season Finale

