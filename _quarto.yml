project:
  type: website
  output-dir: docs
  # Custom domain for GitHub Pages; copied into docs/ on every render
  resources:
    - CNAME

website:
  title: "babbling books"
  description: "A book club podcast with best friends Hannah and Patty. New episodes every Sunday at 9pm."
  favicon: images/icon.png
  site-url: https://babbling-books.com
  open-graph: true

format:
  html:
    theme: [default, theme.scss]
    css: styles.css
    page-layout: custom
    toc: false
    anchor-sections: false
    include-in-header: _partials/head.html
    include-before-body: _partials/header.html
    include-after-body: _partials/footer.html
