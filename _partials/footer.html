<script>
  // Highlight the current page in both navs
  (function () {
    var page = /episodes(\.html)?$/.test(location.pathname) ? 'episodes' : 'home';
    document.querySelectorAll('[data-nav="' + page + '"]').forEach(function (a) {
      a.setAttribute('aria-current', 'page');
    });
  })();

  // "in 10 days" / "tomorrow" / "tonight" next to premiere dates; hidden once it's out
  (function () {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    document.querySelectorAll('.countdown[data-premiere]').forEach(function (el) {
      var p = el.dataset.premiere.split('-').map(Number);
      var days = Math.round((new Date(p[0], p[1] - 1, p[2]) - today) / 86400000);
      if (days < 0) return el.remove();
      el.textContent = days === 0 ? 'Tonight!' : days === 1 ? 'Tomorrow!' : 'in ' + days + ' days';
    });
  })();
</script>
